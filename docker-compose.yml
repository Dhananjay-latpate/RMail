# Multi-Organization Mail Server Deployment
#
# Builds the RMail fork (Stalwart + enterprise features) from source.
# PostgreSQL stores all tenant data with logical isolation.
#
# Usage:
#   1. Copy .env.example to .env and configure ALL required values
#   2. Run: docker compose up -d --build
#   3. Access admin at https://localhost:443 or http://localhost:8080
#   4. Onboard orgs via scripts/setup-org.sh or product portal

services:
  postgres:
    image: postgres:16-alpine
    container_name: rmail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stalwart}
      POSTGRES_USER: ${POSTGRES_USER:-stalwart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stalwart}"]
      interval: 10s
      timeout: 5s
      retries: 5

  stalwart:
    build:
      context: .
      dockerfile: Dockerfile
    image: rmail/server:latest
    container_name: rmail-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMIN_SECRET: ${ADMIN_SECRET:?Set ADMIN_SECRET in .env}
      DB_URL: postgresql://${POSTGRES_USER:-stalwart}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stalwart}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.localhost}
      ENTERPRISE_LICENSE_KEY: ${ENTERPRISE_LICENSE_KEY:?Set ENTERPRISE_LICENSE_KEY in .env}
    volumes:
      - stalwart_data:/opt/stalwart
      - ./resources/config/multi-org-config.toml:/opt/stalwart/etc/config.toml:ro
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "4190:4190"
      - "443:443"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/healthz/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local
  stalwart_data:
    driver: local
